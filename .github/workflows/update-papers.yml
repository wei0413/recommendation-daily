name: Update papers and deploy

on:
  schedule:
    # 10:17 Asia/Shanghai, Monday through Friday.
    - cron: "17 2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch recent arXiv papers
        run: python scripts/update_papers.py
      - name: Read public author affiliations
        env:
          AFFILIATION_LIMIT: "24"
        run: python scripts/enrich_affiliations.py
      - name: Install full-text PDF reader
        run: python -m pip install --disable-pip-version-check --no-input pypdf==6.19.0
      - name: Generate Chinese reading notes
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ENRICH_LIMIT: "30"
          ENRICH_START_DATE: "2026-09-10"
          FULL_TEXT_DIRECT_LIMIT: "120000"
          FULL_TEXT_CHUNK_CHARS: "45000"
        run: python scripts/enrich_papers.py
      - name: Save refreshed data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/recommendations.json
          git diff --cached --quiet || git commit -m "data: refresh daily papers"
          git push
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
